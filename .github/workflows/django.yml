name: Join Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12.1]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py makemigrations 
        python manage.py migrate
    - name: Run Tests
      run: |
        python manage.py test
    - name: 📂 Sync files
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}  # Verwende dies, wenn du passwortbasierte Authentifizierung verwendest
        port: 49393
        source: "./*"  # Hier gibst du den Pfad zu den lokalen Dateien an
        target: "/root/join_backend/"
    - name: 🔄 Stop and Restart Python App
      run: |
        sshpass -p ${{ secrets.PASSWORD }} ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} -p 49393 << 'EOF'
        pkill -f "python"  # Beendet den Python-Prozess (falls er läuft)
        cd /root/join_backend/
        source venv/bin/activate  # Aktiviert das virtuelle Environment
        nohup python manage.py runserver 0.0.0.0:8000 &  # Startet den Server im Hintergrund
        EOF
